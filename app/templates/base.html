<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>{% block title %}Result Dashboard{% endblock %}</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --font-mono: 'JetBrains Mono', monospace;
            --font-sans: 'Inter', sans-serif;
        }

        body {
            font-family: var(--font-sans);
            -webkit-tap-highlight-color: transparent;
        }

        .font-mono {
            font-family: var(--font-mono);
        }

        @media (max-width: 640px) {

            input,
            select,
            textarea,
            button {
                font-size: 16px !important;
            }
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>

<body class="min-h-screen">
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <div class="fixed top-2 right-2 md:top-4 md:right-4 z-50 space-y-2 max-w-[90vw] md:max-w-md">
        {% for category, message in messages %}
        <div class="flash-message px-3 py-2 md:px-4 md:py-3 rounded-lg shadow-lg text-sm
                              {% if category == 'success' %}bg-teal-500 text-white
                              {% elif category == 'danger' %}bg-red-500 text-white
                              {% elif category == 'warning' %}bg-amber-500 text-white
                              {% else %}bg-blue-500 text-white{% endif %}">
            {{ message }}
        </div>
        {% endfor %}
    </div>
    {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}

    {% block extra_js %}{% endblock %}

    <script>
        setTimeout(() => {
            document.querySelectorAll('.flash-message').forEach(el => {
                el.style.opacity = '0';
                el.style.transition = 'opacity 0.5s';
                setTimeout(() => el.remove(), 500);
            });
        }, 4000);
    </script>
</body>

</html>
